name: Build Windows exe

# Publish a release either way:
#  - push a tag like v2.0.0, or
#  - Actions tab -> "Build Windows exe" -> Run workflow, and enter a tag.
# Run it with the tag left empty to only build a downloadable artifact.
#
# The build runs build_exe.bat, the same script as a local build, with Python 3.8
# (the last Python for Windows 7). It builds on Windows Server, not Windows 7: if the
# exe does not start on a Windows 7 HMI PC, build it there with build_exe.bat.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v2.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the version
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:TAG_INPUT.Trim() }
          # -cnotmatch: case-sensitive, so 'V1.0.0' is refused too (PowerShell's -notmatch ignores case)
          if ($tag -cnotmatch '^v(\d+)\.(\d+)\.(\d+)$') { throw "Tag must look like v1.2.3, got '$tag' (lowercase v)" }
          $major, $minor, $patch = $Matches[1], $Matches[2], $Matches[3]
          $v = $tag.Substring(1)
          $errors = @()
          if (-not (Select-String -Path logloss_watcher.py -Pattern "^VERSION = `"$([regex]::Escape($v))`"" -Quiet)) {
            $errors += "VERSION in logloss_watcher.py" }
          if (-not (Select-String -Path version_info.txt -Pattern "'ProductVersion', '$([regex]::Escape($v))'" -Quiet)) {
            $errors += "ProductVersion in version_info.txt" }
          $fv = "filevers=($major, $minor, $patch, 0)"
          if (-not (Select-String -Path version_info.txt -SimpleMatch $fv -Quiet)) { $errors += "filevers in version_info.txt" }
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($v))\s*$" -Quiet)) {
            $errors += "a '## $v' section in CHANGELOG.md" }
          if ($errors) { throw "Tag $tag does not match: $($errors -join ', ')" }
          "Version $v matches the tag"
          "TAG=$tag" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Check the code compiles
        run: python -m py_compile logloss_watcher.py llw_core.py llw_tray.py tools/collect_licenses.py

      - name: Build exe (build_exe.bat)
        shell: cmd
        env:
          PY: python
        run: call build_exe.bat

      - name: Check the build output
        shell: pwsh
        run: |
          foreach ($f in 'LogLoss_Watcher.exe', 'README.txt', 'THIRD_PARTY_LICENSES.txt') {
            if (-not (Test-Path "dist\LogLoss_Watcher\$f")) { throw "missing dist\LogLoss_Watcher\$f" } }
          if (-not (Select-String -Path dist\LogLoss_Watcher\THIRD_PARTY_LICENSES.txt -Pattern '^pylogix ' -Quiet)) {
            throw "THIRD_PARTY_LICENSES.txt has no pylogix section" }
          "Build output OK"

      - name: Zip and checksum
        shell: pwsh
        run: |
          $name = if ($env:TAG) { "LogLoss_Watcher-$env:TAG.zip" } else { "LogLoss_Watcher.zip" }
          Compress-Archive -Path dist\LogLoss_Watcher -DestinationPath "dist\$name" -Force
          $h = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash
          "$h  $name" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
          "ZIP=$name" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - uses: actions/upload-artifact@v5
        with:
          name: LogLoss_Watcher
          path: |
            dist/${{ env.ZIP }}
            dist/SHA256SUMS.txt

      - name: Publish release
        if: env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $files = "dist\$env:ZIP", 'dist\SHA256SUMS.txt'
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # release already exists (e.g. created on the web): replace its files
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --target $env:GITHUB_SHA `
              --title "LogLoss Watcher $env:TAG" `
              --notes "Windows build (Python 3.8, for Windows 7 SP1 / 10 / 11). Unzip and copy the whole LogLoss_Watcher folder to the HMI PC, then start LogLoss_Watcher.exe in it - no Python needed. Keep THIRD_PARTY_LICENSES.txt in the folder. Built on Windows Server: if it does not start on Windows 7, build it there with build_exe.bat. The exe is unsigned, so Windows SmartScreen may warn on first launch (More info -> Run anyway). Verify the zip against SHA256SUMS.txt."
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
